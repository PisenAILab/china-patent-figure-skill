# 中国专利附图 Skill 打包配置。PyPI 包名 china-patent-figure-skill，入口命令 pfk（patent-figure-kit 为兼容别名）。
#
# wheel 布局：把仓库树（scripts/ webui/ schemas/ examples/ references/ acceptance/ tests/ docs/openapi.yaml）
# 原样装进包目录 patent_figure_kit/，所有资源仍按「脚本文件位置」定位，代码零改动；scripts/pfk_cli.py
# 同时作为包的 __init__.py，提供入口点。webui/dev/（开发脚手架与截图，约 10 MB）不进 wheel。
#
# 依赖：核心六项与 requirements-pinned.txt 逐字一致（doctor.py 的 PINNED 表是同一份数据）；
# Web 工作台与导出包为 extras [web]，版本与 requirements-web.txt 一致。改版本时三处同步。
# 包目录仍是 patent_figure_kit；入口命令 pfk 为主，patent-figure-kit 保留兼容。

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "china-patent-figure-skill"
dynamic = ["version"]
description = "中国专利附图 Skill：从 3D 模型一步出专利附图。From STEP to FIG. 1 — deterministic patent figures from a 3D CAD assembly (STEP): hidden-line removal, auto-numbered leaders, QA gates, CNIPA/USPTO PDF · Word · DXF."
readme = { file = "README.md", content-type = "text/markdown" }
keywords = ["patent", "patent-drawings", "figures", "STEP", "CAD", "OpenCASCADE", "hidden-line-removal", "DXF", "CNIPA", "USPTO", "MCP"]
authors = [{ name = "中国专利附图 Skill contributors" }]
license = { text = "MIT" }
requires-python = ">=3.9,<3.13"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Office/Business",
    "Environment :: Web Environment",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "cadquery-ocp==7.7.2",
    "ezdxf==1.4.2",
    "numpy==2.0.2",
    "jsonschema==4.25.1",
    "matplotlib==3.9.4",
    "pytest==8.4.2",
]

[project.optional-dependencies]
web = [
    "fastapi==0.128.8",
    "python-multipart==0.0.20",
    "uvicorn==0.39.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "python-docx==1.2.0",
    "pypdf==6.7.4",
    "pypdfium2==5.10.1",
]
# 验收 N14 跑完整 pytest；openapi 契约测试需要 PyYAML（缺它时那几条会被跳过而不是失败）。
test = ["pyyaml==6.0.3"]

[project.scripts]
pfk = "patent_figure_kit:main"                        # 主入口：pfk start / doctor / acceptance / <工具>
patent-figure-kit = "patent_figure_kit:start_main"    # 别名：直接启动工作台

[project.urls]
Homepage = "https://github.com/PisenAILab/china-patent-figure-skill"
Repository = "https://github.com/PisenAILab/china-patent-figure-skill"
Documentation = "https://github.com/PisenAILab/china-patent-figure-skill#readme"
Changelog = "https://github.com/PisenAILab/china-patent-figure-skill/blob/main/CHANGELOG.md"
Issues = "https://github.com/PisenAILab/china-patent-figure-skill/issues"

[tool.hatch.version]
path = "scripts/pfk_cli.py"

[tool.hatch.build.targets.wheel]
only-include = [
    "scripts",
    "profiles",
    "webui",
    "schemas",
    "examples",
    "references",
    "acceptance",
    "tests",
    "docs/openapi.yaml",
    "requirements-pinned.txt",
    "requirements-web.txt",
    "SKILL.md",
    "AGENTS.md",
    "LICENSE",
]
exclude = [
    "webui/dev",
    "**/__pycache__",
    "**/*.pyc",
    "**/.pytest_cache",
    "**/.DS_Store",
    "examples/**/*.stp",
    "examples/**/out",
]

[tool.hatch.build.targets.wheel.sources]
"" = "patent_figure_kit"

[tool.hatch.build.targets.wheel.force-include]
# sources 前缀对 force-include 同样生效，所以这里写包内相对路径。wheel 里 scripts/pfk_cli.py 只出现在这一处
# （hatch 对同一源文件只收一次）：入口点、`python -m`/测试都经包 patent_figure_kit 找到它。
"scripts/pfk_cli.py" = "__init__.py"

[tool.hatch.build.targets.sdist]
exclude = [
    "webui/dev/screens",
    "webui/dev/static-site",
    "static-site",
]
